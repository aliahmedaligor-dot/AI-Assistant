name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract AI Assistant project
        run: |
          rm -rf app
          mkdir app
          unzip -q AI_Assistant_Gemini_API_IN_APP.zip -d app

      - name: Create Android project files
        working-directory: app
        run: |
          flutter create --platforms=android .

      - name: Fix Android permissions
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>',
          ]

          match = re.search(r'<manifest\b[^>]*>', text, re.S)

          if not match:
              raise RuntimeError(
                  "AndroidManifest.xml: <manifest> tag not found"
              )

          insert_at = match.end()
          additions = []

          for permission in permissions:
              if permission.strip() not in text:
                  additions.append(permission)

          if additions:
              text = (
                  text[:insert_at]
                  + '\n'
                  + '\n'.join(additions)
                  + text[insert_at:]
              )

          p.write_text(text)
          PY

      - name: Fix Dart compatibility issues
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/main.dart")
          text = p.read_text()

          text = text.replace(
              'ممنوع عرض LaTeX بين $...$ أو $$...$$، وممنوع وضع $ حول الأرقام أو المعادلات.',
              'ممنوع عرض LaTeX بين علامات الدولار، وممنوع وضع علامات الدولار حول الأرقام أو المعادلات.'
          )

          text = text.replace(
              'listenOptions: const stt.SpeechListenOptions(',
              'listenOptions: stt.SpeechListenOptions('
          )

          text = text.replace(
              'FilePicker.pickFile(type: FileType.any, withData: false)',
              'FilePicker.pickFile(type: FileType.any)'
          )

          p.write_text(text)
          PY

      - name: Install dependencies
        working-directory: app
        run: |
          flutter pub get

      - name: Remove default Flutter test
        working-directory: app
        run: |
          rm -f test/widget_test.dart

      - name: Analyze Flutter project
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release

      - name: Build Android App Bundle
        working-directory: app
        run: |
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant-AAB
          path: app/build/app/outputs/bundle/release/app-release.aab
